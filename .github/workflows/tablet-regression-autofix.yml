name: Tablet regression autofix

on:
  push:
    branches:
      - fix/tablet-regression-recovery

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[tablet-autofix-complete]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/tablet-regression-recovery
          fetch-depth: 0

      - name: Apply guarded source patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            const occurrences = source.split(before).length - 1;
            if (occurrences !== 1) {
              throw new Error(`PATCH_ANCHOR_MISMATCH:${path}:${occurrences}`);
            }
            fs.writeFileSync(path, source.replace(before, after), 'utf8');
          }

          replaceOnce(
            'src/features/catalog/pages/CatalogCategoryPage.tsx',
            `  return (\n    <div\n      ref={ref}\n      role="button"\n      tabIndex={-1}\n      className={\n        'relative overflow-hidden grid grid-cols-[3.6rem_minmax(0,1fr)_auto] items-center gap-3 rounded-[0.55rem] border px-3 py-2.5 transition ' +`,
            `  return (\n    <button\n      ref={ref}\n      type="button"\n      onClick={onEnterPress}\n      className={\n        'relative grid w-full appearance-none grid-cols-[3.6rem_minmax(0,1fr)_auto] items-center gap-3 overflow-hidden rounded-[0.55rem] border px-3 py-2.5 text-left transition ' +`,
          );
          replaceOnce(
            'src/features/catalog/pages/CatalogCategoryPage.tsx',
            `      ) : null}\n    </div>\n  );\n}\n\nexport function CatalogCategoryPage`,
            `      ) : null}\n    </button>\n  );\n}\n\nexport function CatalogCategoryPage`,
          );

          replaceOnce(
            'src/features/catalog/pages/CatalogPage.tsx',
            `    const candidates = Array.from(uniqueItems.values()).filter(\n      (item) => getHorizontalHeroArtworkCandidates(item).length > 0,\n    );`,
            `    const candidates = Array.from(uniqueItems.values()).filter(\n      (item) =>\n        getHorizontalHeroArtworkCandidates(item).length > 0 ||\n        Boolean(item.posterUrl?.trim()),\n    );`,
          );
          replaceOnce(
            'src/features/catalog/pages/CatalogPage.tsx',
            `      isArtworkReady: (item) =>\n        getHorizontalHeroArtworkCandidates(item).length > 0,\n    }).items;`,
            `      isArtworkReady: (item) =>\n        getHorizontalHeroArtworkCandidates(item).length > 0 ||\n        Boolean(item.posterUrl?.trim()),\n    }).items;`,
          );
          replaceOnce(
            'src/features/catalog/pages/CatalogPage.tsx',
            `          backgroundUrl={resolveHomeHeroArtworkUrl(heroItem, 'horizontal')}\n          artworkCandidates={isMobile ? undefined : getHorizontalHeroArtworkCandidateRecords(heroItem)}`,
            `          backgroundUrl={resolveHomeHeroArtworkUrl(heroItem, 'horizontal')}\n          fallbackPosterUrl={heroItem?.posterUrl}\n          artworkCandidates={isMobile ? undefined : getHorizontalHeroArtworkCandidateRecords(heroItem)}`,
          );

          replaceOnce(
            'src/components/media/CatalogHero.tsx',
            `  backgroundUrl?: string;\n  artworkCandidates?: LocalCatalogArtworkCandidate[];`,
            `  backgroundUrl?: string;\n  fallbackPosterUrl?: string;\n  artworkCandidates?: LocalCatalogArtworkCandidate[];`,
          );
          replaceOnce(
            'src/components/media/CatalogHero.tsx',
            `  metadata,\n  backgroundUrl,\n  artworkCandidates,`,
            `  metadata,\n  backgroundUrl,\n  fallbackPosterUrl,\n  artworkCandidates,`,
          );
          replaceOnce(
            'src/components/media/CatalogHero.tsx',
            `  const imageCandidates = useMemo(\n    () =>\n      Array.from(\n        new Set(\n          [\n            backgroundUrl,\n            ...(artworkCandidates?.map((candidate) => candidate.url) ?? []),\n          ].filter((value): value is string => Boolean(value?.trim())),\n        ),\n      ),\n    [artworkCandidates, backgroundUrl],\n  );\n  const imageCandidatesKey = imageCandidates.join('|');\n  const [imageIndex, setImageIndex] = useState(0);`,
            `  const normalizedFallbackPosterUrl = fallbackPosterUrl?.trim() || null;\n  const imageCandidates = useMemo(\n    () =>\n      Array.from(\n        new Set(\n          [\n            backgroundUrl,\n            ...(artworkCandidates?.map((candidate) => candidate.url) ?? []),\n            normalizedFallbackPosterUrl,\n          ].filter((value): value is string => Boolean(value?.trim())),\n        ),\n      ),\n    [artworkCandidates, backgroundUrl, normalizedFallbackPosterUrl],\n  );\n  const imageCandidatesKey = imageCandidates.join('|');\n  const [imageIndex, setImageIndex] = useState(0);`,
          );
          replaceOnce(
            'src/components/media/CatalogHero.tsx',
            `  const activeImageUrl = imageCandidates[imageIndex] ?? backgroundUrl;`,
            `  const activeImageUrl = imageCandidates[imageIndex] ?? backgroundUrl;\n  const isFallbackPoster =\n    Boolean(normalizedFallbackPosterUrl) &&\n    activeImageUrl === normalizedFallbackPosterUrl &&\n    activeImageUrl !== backgroundUrl &&\n    !(artworkCandidates ?? []).some(\n      (candidate) => candidate.url === activeImageUrl,\n    );`,
          );
          replaceOnce(
            'src/components/media/CatalogHero.tsx',
            `      style={\n        backgroundUrl\n          ? {`,
            `      style={\n        backgroundUrl || normalizedFallbackPosterUrl\n          ? {`,
          );
          replaceOnce(
            'src/components/media/CatalogHero.tsx',
            `          className="absolute inset-0 h-full w-full object-cover opacity-100"`,
            `          className={cn(\n            'absolute inset-0 h-full w-full opacity-100',\n            isFallbackPoster ? 'bg-black/80 object-contain' : 'object-cover',\n          )}`,
          );

          replaceOnce(
            'android/app/src/main/java/com/xandeflix/app/NativePlayerActivity.java',
            'playerView.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_ZOOM);',
            'playerView.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_FIT);',
          );
          replaceOnce(
            'android/app/src/main/java/com/xandeflix/app/NativeAndroidPlayerPlugin.java',
            'inlinePreviewView.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_FILL);',
            'inlinePreviewView.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_FIT);',
          );

          const smokeScript = `import { readFile } from 'node:fs/promises';\n\nconst files = {\n  category: 'src/features/catalog/pages/CatalogCategoryPage.tsx',\n  catalog: 'src/features/catalog/pages/CatalogPage.tsx',\n  hero: 'src/components/media/CatalogHero.tsx',\n  fullscreen: 'android/app/src/main/java/com/xandeflix/app/NativePlayerActivity.java',\n  preview: 'android/app/src/main/java/com/xandeflix/app/NativeAndroidPlayerPlugin.java',\n};\n\nconst source = Object.fromEntries(\n  await Promise.all(\n    Object.entries(files).map(async ([key, path]) => [key, await readFile(path, 'utf8')]),\n  ),\n);\n\nconst checks = [\n  ['episode-touch-native-button', source.category.includes('<button\\n      ref={ref}\\n      type="button"\\n      onClick={onEnterPress}')],\n  ['episode-touch-old-div-removed', !source.category.includes('<div\\n      ref={ref}\\n      role="button"\\n      tabIndex={-1}')],\n  ['home-hero-poster-candidate', source.catalog.includes('Boolean(item.posterUrl?.trim())')],\n  ['home-hero-fallback-prop', source.catalog.includes('fallbackPosterUrl={heroItem?.posterUrl}')],\n  ['catalog-hero-fallback-rendering', source.hero.includes('normalizedFallbackPosterUrl') && source.hero.includes('isFallbackPoster')],\n  ['fullscreen-preserves-aspect-ratio', source.fullscreen.includes('RESIZE_MODE_FIT') && !source.fullscreen.includes('RESIZE_MODE_ZOOM')],\n  ['inline-preview-preserves-aspect-ratio', source.preview.includes('RESIZE_MODE_FIT') && !source.preview.includes('RESIZE_MODE_FILL')],\n];\n\nconst failed = checks.filter(([, passed]) => !passed).map(([name]) => name);\nconst result = {\n  pass: failed.length === 0,\n  checks: Object.fromEntries(checks),\n  failed,\n};\n\nprocess.stdout.write(\`\${JSON.stringify(result, null, 2)}\\n\`);\n\nif (!result.pass) {\n  process.exitCode = 1;\n}\n`;
          fs.writeFileSync(
            'scripts/run-tablet-regression-source-smokes.mjs',
            smokeScript,
            'utf8',
          );

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.scripts['test:tablet-regressions'] =
            'node scripts/run-tablet-regression-source-smokes.mjs';
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`, 'utf8');
          NODE

      - name: Install dependencies without repository postinstall mutation
        run: npm ci --ignore-scripts

      - name: Run tablet regression source smoke
        run: npm run test:tablet-regressions

      - name: Run data governance guardrail
        run: npm run governance:check

      - name: Build project
        run: npm run build

      - name: Remove temporary autofix workflow
        run: rm .github/workflows/tablet-regression-autofix.yml

      - name: Commit verified recovery patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            scripts/run-tablet-regression-source-smokes.mjs \
            src/features/catalog/pages/CatalogCategoryPage.tsx \
            src/features/catalog/pages/CatalogPage.tsx \
            src/components/media/CatalogHero.tsx \
            android/app/src/main/java/com/xandeflix/app/NativePlayerActivity.java \
            android/app/src/main/java/com/xandeflix/app/NativeAndroidPlayerPlugin.java \
            .github/workflows/tablet-regression-autofix.yml
          git commit -m "fix(tablet): recover episode touch hero fallback and aspect ratio [tablet-autofix-complete]"
          git push origin HEAD:fix/tablet-regression-recovery
